site_name: GPU 芯片全栈知识体系（原厂视角）
site_description: 从硬件微架构、显存互联到 Linux 驱动、AI 编译器与分布式集群的 GPU 全栈知识库
site_url: https://xidianedu.cc/tech/gpu/
docs_dir: .
site_dir: ../GPU-site
exclude_docs: |
  mkdocs.yml
  requirements-docs.txt
  overrides/
theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: zh
  - mermaid2
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
extra_javascript:
  - javascripts/gpu-controls.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
