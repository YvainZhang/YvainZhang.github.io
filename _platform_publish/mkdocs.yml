site_name: 平台架构实践
site_description: 从接口契约、资源预算与退出边界出发，整理平台设计、交付与演进取舍。
site_author: Yvain Zhang
site_url: https://xidianedu.cc/tech/platform/
docs_dir: ../Platform
site_dir: ../Platform-site
use_directory_urls: true

theme:
  name: material
  language: zh
  custom_dir: ../_collection_theme
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: platform-mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

hooks:
  - mermaid_source.py
extra_javascript:
  - /assets/collections/reading-controls.js
  - javascripts/vendor/mermaid-10.4.0.min.js
  - javascripts/platform-diagrams.js

extra_css:
  - /assets/collections/reading.css

extra:
  collection_label: Platform Architecture
  generator: false
  homepage: /tech/
copyright: Copyright &copy; 2026 Yvain Zhang

not_in_nav: |
  mechanisms/**
  design/01-boot-hardware.md
  cases/01-stop-drain.md
  cases/02-inflight-budget.md
  cases/04-exec-fd.md
nav:
  - 专题概览: README.md
  - 实验环境索引: guide/environment.md
  - 架构推演:
      - 负载、容量与 admission: design/09-capacity-admission.md
      - 故障模型与恢复边界: design/10-failure-recovery.md
      - 接口兼容与所有权演进: design/11-contract-evolution.md
  - 平台设计:
      - SDK 需求与契约: design/02-sdk-contract.md
      - 跨系统运行时边界: design/03-linux-freertos.md
      - 可靠性与交付: design/04-reliability-delivery.md
      - 芯片与平台选型: design/05-platform-selection.md
      - 资源与性能预算: design/06-resource-budget.md
      - 复杂度与演进: design/07-complexity-evolution.md
      - 全生命周期评审: design/08-lifecycle-review.md
  - 恢复案例: cases/03-cross-runtime-recovery.md
  - 实验参考:
      - 源码与许可: reference/source.md
      - SDK API: reference/api.md
      - 验证范围与记录: reference/verification.md
