site_name: Audio 音频芯片与系统全栈知识体系
site_description: 从物理声波、AFE/Codec、I2S/PDM/SoundWire、Audio DSP 到 Linux ALSA/ASoC 驱动与声学算法的全栈知识库
site_url: https://xidianedu.cc/tech/audio/
site_author: Yvain Zhang
docs_dir: .
site_dir: ../Audio-site
exclude_docs: |
  mkdocs.yml
  requirements-docs.txt
  overrides/
  **/__pycache__/
  .venv-docs/**
  .venv/**
theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: zh
  - mermaid2
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
extra_javascript:
  - javascripts/audio-controls.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
