name: Build and deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SoC/requirements-docs.txt

      - name: Install knowledge base dependencies
        run: pip install -r SoC/requirements-docs.txt

      - name: Build Jekyll blog
        run: bundle exec jekyll build --destination _site

      - name: Build SoC knowledge base
        run: mkdocs build --strict --config-file _soc_publish/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/tech/soc"

      - name: Build Wi-Fi knowledge base
        run: mkdocs build --strict --config-file WiFi/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/tech/wifi"

      - name: Build GPU knowledge base
        run: mkdocs build --strict --config-file GPU/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/tech/gpu"

      - name: Build NPU knowledge base
        run: mkdocs build --strict --config-file NPU/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/tech/npu"

      - name: Build Audio knowledge base
        run: mkdocs build --strict --config-file Audio/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/tech/audio"

      - name: Build RTOS knowledge base
        run: mkdocs build --strict --config-file RTOS/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/tech/rtos"

      - name: Verify combined site
        run: |
          test -f _site/index.html
          test -f _site/tech/index.html
          test -f _site/tech/soc/index.html
          test -f _site/tech/wifi/index.html
          test -f _site/tech/gpu/index.html
          test -f _site/tech/npu/index.html
          test -f _site/tech/audio/index.html
          test -f _site/tech/rtos/index.html
          test -f _site/tech/rtos/Projects/rvkernel/index.html
          test -f _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
