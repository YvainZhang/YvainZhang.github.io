loop_section:
  kicker: "01 / RUNTIME ARCHITECTURE"
  title: "Agent 的执行循环与状态管理"
  lead: "模型提出动作，工具执行动作，运行时再把结果返回给模型。这里按六个阶段梳理这个循环，重点看状态如何记录、失败如何处理，以及何时可以确认任务完成。"
  study_url: "/geek/runtime/"
  study_text: "阅读《Agent 运行时设计笔记》 ↗"
  axioms:
    - title: "工具范围与执行预算"
      tag: "TOOL LIMITS"
      desc: "先定义允许使用的工具、参数范围和预算。状态转移规则有助于控制执行流程，但不能保证模型一定找到正确方案。"
      expand_title: "展开查看设计守则"
      expand_points:
        - "执行前用 JSON Schema / Pydantic 检查参数类型、必填字段和范围"
        - "设定步数与时间预算，耗尽时明确返回未完成状态"
    - title: "状态显式化 (Explicit State Representation)"
      tag: "EXPLICIT STATE"
      desc: "工作目录、已修改文件、剩余步数和关键检查结果由运行时记录。每轮提供相关状态，减少只依靠历史对话推断环境的错误。"
      expand_title: "展开查看注入格式"
      expand_points:
        - "每轮在提示词末尾注入 [STATE: Path, Step 8/25, Modified Files List]"
        - "将上步检查结果结构化输入，必要时回读完整日志"
    - title: "副作用与失败恢复"
      tag: "RECOVERY PLAN"
      desc: "区分可重复执行的操作与有副作用的操作。文件快照、Git 记录和进程超时各自解决一部分恢复问题，外部设备或网络操作还需单独设计。"
      expand_title: "展开查看沙箱机制"
      expand_points:
        - "文件快照只恢复本步骤的修改，保留用户已有改动"
        - "PTY 或管道都要持续读取输出；超时按任务设置，PTY 本身不提供权限隔离"
  stages:
    - num: "01"
      name: "GOAL & CONSTRAINTS"
      sub: "目标规范化与边界定义"
      detail: "记录用户目标、验收要求、工具权限、步数预算和时间上限，明确任务范围。"
      expand_points:
        - "运行时保留原始任务与后续用户修正，模型不自行扩大授权范围"
        - "限制工具的文件访问范围，并处理符号链接与路径解析"
    - num: "02"
      name: "CONTEXT ASSEMBLY"
      sub: "上下文预算与缓存装配"
      detail: "将稳定提示放在前面，按预算选择近期历史和日志摘要。缓存是否命中取决于服务规则与共享前缀。"
      expand_points:
        - "保持稳定内容及序列化顺序一致，把动态状态放在后面"
        - "提取退出码和关键报错，保留完整构建日志供回查"
    - num: "03"
      name: "INFERENCE & ROUTING"
      sub: "模型决策与工具调用意图"
      detail: "模型输出工具调用或完成声明。运行时在执行前检查参数与权限，完成声明则进入验收流程。"
      expand_points:
        - "必填字段与类型不符合契约时，返回具体错误供下一轮修正"
        - "独立调用可以并发，有依赖的步骤按顺序执行"
    - num: "04"
      name: "SANDBOX EXECUTION"
      sub: "受限沙箱隔离执行"
      detail: "在约定的权限和隔离范围内执行工具，持续读取输出并监控超时。容器、进程组和 PTY 各有不同作用。"
      expand_points:
        - "危险命令匹配只能补充检查，不能代替操作系统权限限制"
        - "超时后尝试终止进程组；已脱离该组的进程需额外回收机制"
    - num: "05"
      name: "OBSERVATION & EVAL"
      sub: "结果提取与任务检查"
      detail: "提取日志中的相关结果，再用测试、断言或设备查询检查当前状态。检查范围应与任务要求对应。"
      expand_points:
        - "退出码 0 只表示对应检查通过，还需核对其覆盖范围"
        - "去掉重复进度输出，返回关键证据与原始日志位置"
    - num: "06"
      name: "STATE TRANSITION"
      sub: "工作记忆更新与终止判定"
      detail: "更新进度、假设和检查结果。验收通过则结束；失败时选择下一步排查；预算耗尽则报告未完成部分。"
      expand_points:
        - "失败后说明哪些假设已排除，以及下一步需要什么证据"
        - "按任务记录 Diff 或 Git 提交，保留修改过程与验收结果"

context_section:
  kicker: "02 / CONTEXT ENGINEERING"
  title: "上下文工程：本轮请求该带上什么"
  lead: "指令之外，模型还需要当前状态、相关代码和工具反馈。这里讨论如何选择这些信息，避免重复日志占满窗口，也避免压缩时丢掉关键约束。"
  study_url: "/geek/context/"
  study_text: "阅读《上下文工程笔记》 ↗"
  pillars:
    - title: "Attention Budget 与 KV Cache 优化"
      tag: "CACHE-AWARE ARCHITECTURE"
      badge: "LATENCY & COST"
      highlight: "将稳定内容放在前面，便于复用共享前缀的预填充结果。"
      points:
        - "稳定内容：系统提示词、工具声明和代码规范尽量保持一致；实际命中需查看所用服务的规则。"
        - "信息相关性：长历史可能增加开销并影响信息检索，文件数量或 Token 数量不能直接推出统一的准确率下降阈值。"
        - "当前状态：在动态区域简短重述目标与验收要求，权限和终止条件仍由运行时执行。"
      expand_points:
        - "测量缓存命中率、首字延迟和实际计费；缓存通常不加速新 Token 解码"
        - "前缀中的时间戳或不稳定排序会缩短可复用部分，应移到动态区域"
    - title: "三层记忆体系分级解耦"
      tag: "LAYERED MEMORY HIERARCHY"
      badge: "WORKING / BUFFER / VECTOR"
      highlight: "用 L1/L2/L3 类比区分当前状态、近期历史和跨会话记录。"
      points:
        - "L1 工作状态：当前目标、待办步骤、已验证事实和环境状态，按步骤更新。"
        - "L2 近期历史：保留最近几轮动作与反馈，窗口大小按预算调整；长日志另存，摘要保留来源。"
        - "L3 长期记录：存放经核对的排查结论和规范，可用向量或关键词检索；相似问题仍需重新验证。"
      expand_points:
        - "完成的步骤移出活跃状态，但必要决定与用户约束应保留"
        - "长期记录附适用版本与来源，避免把旧结论套到新环境"
    - title: "工具契约与 Model Context Protocol (MCP)"
      tag: "TOOL PROTOCOL & CONTRACT"
      badge: "STANDARDIZED RPC"
      highlight: "将可复用的工具暴露为协议接口，执行权限由服务和运行时分别检查。"
      points:
        - "参数校验：拦截缺失字段、类型和范围错误；通过校验仍不代表动作符合任务意图。"
        - "MCP 接入：Git、GDB、检索或抓包工具可作为外部服务复用，需核对客户端能力、认证与传输方式。"
        - "失败恢复：文件快照可撤销本步骤修改，但不自动保证项目可构建，也不能撤销所有外部副作用。"
      expand_points:
        - "Host 管理 Client，由 Client 连接 Server；常用传输有 stdio 和 Streamable HTTP"
        - "小范围实验可直接调用本地函数，有跨客户端复用需求时再引入服务接口"
    - title: "分层子代理 (Hierarchical Subagent)"
      tag: "TASK DELEGATION"
      badge: "SEPARATE CONTEXT"
      highlight: "独立搜索交给子上下文，主会话接收结论、来源和未确认项。"
      points:
        - "拆分依据：根据任务独立性和信息相关性分工，不以固定文件数判断是否需要子代理。"
        - "主子代理分工：主代理维护任务计划与验收标准，子代理承担检索、检查或文档阅读等有明确边界的任务。"
        - "摘要回传：中间搜索内容不必全部进入主会话，但要保留可核对的来源；子会话是否销毁由具体实现决定。"
      expand_points:
        - "独立任务可以并发，共享文件编辑需要协调"
        - "子代理也会消耗调用预算，摘要丢失的细节必要时由主代理回读"

terminal_section:
  kicker: "03 / TERMINAL AGENTS"
  title: "终端 Coding Agent 的工具与修改流程"
  lead: "终端入口便于沿用构建、Git 和调试工具。这里整理几款编程助手的实现侧重点，IDE 扩展也一并讨论；能力与权限需以所用版本为准。"
  study_url: "/geek/terminal/"
  study_text: "阅读《终端 Coding Agent》 ↗"
  agents:
    - name: "Claude Code"
      tag: "TERMINAL WORKFLOW"
      vendor: "Anthropic 官方"
      features:
        - "文件读写、命令执行与任务反馈接入同一会话"
        - "上下文较长时可压缩历史，重要细节仍需核对"
        - "支持 Subagent 在独立上下文中完成任务"
        - "通过权限配置限制可执行动作"
      verdict: "适合评估终端任务流程；改动质量需要用具体仓库验证"
      expand_points:
        - "观察长任务压缩后是否保留关键约束与修改状态"
        - "按任务配置子代理的工具范围，不能假定子代理都只读"
    - name: "Aider"
      tag: "GIT-NATIVE ARCHITECTURE"
      vendor: "Paul Gauthier / 开源项目"
      features:
        - "基于 Tree-sitter 提取符号的代码地图 (Repo Map)"
        - "默认自动提交模型修改，可按需要关闭"
        - "支持多种差异编辑模式（Search/Replace Block、Whole、Unified Diff）"
        - "按引用关系与预算选择代码地图内容"
      verdict: "可关注 Repo Map 和 Git 工作流是否适合现有工程"
      expand_points:
        - "通过 --map-tokens 配置地图预算，地图不是仓库完整内容"
        - "/undo 用于撤销最近一次 Aider 提交，使用前检查工作区状态"
    - name: "OpenCode / Roo Code / Cline"
      tag: "OPEN ECOSYSTEM"
      vendor: "开源编程工具"
      features:
        - "提供 MCP 工具接入能力，支持范围需按版本核对"
        - "可配置不同模型服务，本地模型还需检查工具调用兼容性"
        - "提供操作确认与自动执行配置"
        - "可配置项目规则与提示词"
      verdict: "有定制工具需求时，可比较接入方式、模型支持和审批粒度"
      expand_points:
        - "核对 MCP Server 的传输方式、认证和客户端能力"
        - "离线部署需检查模型、网络依赖和数据路径，不能仅凭本地运行判断合规"
  challenges:
    - title: "三种代码修改格式的取舍"
      tag: "DIFF STRATEGY"
      desc: "全文件重写输出较多；Unified Diff 要检查格式与上下文；搜索替换块要保证原文唯一匹配。选择格式之后，仍需分别验证改动能否应用、行为是否正确。"
    - title: "PTY 伪终端长任务管理与防挂死"
      tag: "PTY INTERACTION"
      desc: "构建和测试可能持续数分钟，也可能等待交互输入。PTY 或管道都需持续读取输出，监控超时并回收进程；超时值应按任务设定。"
    - title: "沙箱隔离与高危命令防御"
      tag: "SECURITY PERIMETER"
      desc: "限制运行用户权限、文件访问范围和网络访问。危险命令匹配只能补充检查，容器或 MicroVM 也需正确配置才能形成隔离边界。"

embodied_section:
  kicker: "04 / EMBODIED INTELLIGENCE"
  title: "具身控制中的快慢环分工"
  lead: "模型推理与电机反馈控制有不同的周期要求。快慢环是一种分工方式：上层生成动作目标，底层持续执行本地反馈控制，并处理上层延迟或失联。下列频率仅作讨论示例。"
  study_url: "/geek/embodied/"
  study_text: "阅读《具身智能的快慢控制环》 ↗"
  loops:
    - name: "快环 · 实时反射控制 (High-Frequency Reflex Loop)"
      rate: "100Hz ~ 1kHz"
      hardware: "裸机固件 / RTOS (FreeRTOS / Zephyr) / 专用 DSP & FPGA"
      tag: "DETERMINISTIC REFLEX"
      duties:
        - "轨迹插值、编码器反馈和运动限制"
        - "按周期预算安排阻抗控制与逆运动学 (IK) 解算"
        - "对接驱动器电流环、碰撞检测和急停机制"
      constraint: "按控制带宽设定最坏执行时间与抖动预算，关键路径不等待上层推理"
      expand_points:
        - "阻抗模型可用于接触顺应，但需参数整定、力估计与运动限制"
        - "上层失联阈值和停止策略按机构、速度与任务风险验证"
    - name: "慢环 · 语义认知规划 (Low-Frequency Cognitive Loop)"
      rate: "5Hz ~ 20Hz"
      hardware: "端侧高算力 Linux SoC / NPU / Jetson / 本地边缘 GPU"
      tag: "SEMANTIC COGNITION"
      duties:
        - "多模态 VLA (Vision-Language-Action) 端到端模型推理"
        - "RGB-D 多视角点云语义分割、目标识别与 6D 位姿估计"
        - "任务规划与动作目标生成，输出形式依模型而定"
      constraint: "测量感知到动作输出的端到端时延；量化与加速方式需匹配模型和硬件"
      expand_points:
        - "动作可能是末端增量、关节目标或动作片段，由适配层接入控制器"
        - "评估量化、注意力优化和动作分块的时延收益，同时检查动作精度"
  infra:
    - title: "缓冲区共享与跨域通信"
      tag: "DMA-BUF / UIO"
      desc: "dma-buf 可用于 Linux 驱动间共享缓冲区，UIO 可映射设备内存。Linux 与 RTOS 的跨域共享还需处理地址映射、缓存一致性和所有权，不能仅靠接口名称保证零拷贝。"
    - title: "受限设备通信 (Zenoh & micro-ROS)"
      tag: "MICRO-XRCE-DDS"
      desc: "按资源预算与现有 ROS 2 集成选择通信方案。micro-ROS 常用 Micro XRCE-DDS 客户端与 Agent；端到端时延还包含序列化、调度和传输，需实测。"
    - title: "传感器时间戳对齐"
      tag: "PTP / IEEE 1588"
      desc: "PTP 可对齐设备时钟，GPIO 触发与硬件锁存可关联采样事件。时间戳分辨率、时钟同步误差和实际采样延迟需要分别测量。"

