loop_section:
  kicker: "01 / RUNTIME ARCHITECTURE"
  title: "自治 Agent 核心控制闭环与状态机"
  lead: "Agent 与普通大模型对话的分水岭，不在于文本语气是否更像人类，而在于它是否围绕不可逆的目标，在真实环境中完成感知、规划、工具调用、状态暂存与自愈收敛。点击下方各阶段可展开查看关键对策与深入专篇。"
  study_url: "/geek/runtime/"
  study_text: "进入《自治 Agent 核心运行时实战》专篇深入学习 ↗"
  axioms:
    - title: "约束优于自由 (Constraint Over Freedom)"
      tag: "FSM PRUNING"
      desc: "真正的工业级 Agent 不是放任模型天马行空，而是通过严格的状态机转移规则与工具白名单，将解空间剪枝到确定性收敛的局部最优。"
      expand_title: "展开查看设计守则"
      expand_points:
        - "工具入参全部由严格的 JSON Schema / Pydantic 校验，拒绝自由参数猜测"
        - "设定全局 Step 预算（默认 25 步）与超时限制，杜绝死循环消耗"
    - title: "状态显式化 (Explicit State Representation)"
      tag: "NO BLIND ATTENTION"
      desc: "绝不寄希望于大模型在数十万 Token 的自注意力机制中隐式“记住”变量。Step 预算、工作目录、激活环境变量与关键断言必须显式注入上下文。"
      expand_title: "展开查看注入格式"
      expand_points:
        - "每轮在提示词末尾注入 [STATE: Path, Step 8/25, Modified Files List]"
        - "将上步关键断言结果显式结构化输入，消除注意力漂移"
    - title: "工具原子化与回滚守卫 (Atomic & Rollback Guard)"
      tag: "IDEMPOTENT SANDBOX"
      desc: "调用的工具必须具备原子性与幂等性设计。文件修改支持快照自动回滚，命令执行依托非阻塞 PTY 与超时熔断，严格隔离不可逆破坏。"
      expand_title: "展开查看沙箱机制"
      expand_points:
        - "写文件前自动创建临时快照，语法校验报错自动无缝回退"
        - "基于 pty.openpty() 捕获流式输出，30s 熔断看门狗防止终端交互死锁"
  stages:
    - num: "01"
      name: "GOAL & CONSTRAINTS"
      sub: "目标规范化与边界定义"
      detail: "接收自然语言目标，注入系统约束、步数预算 (Step Budget)、超时上限与安全白名单，形成不可变的根任务元数据。"
      expand_points:
        - "根目标注入后作为系统前缀冻结，运行中严格禁止 Agent 自我篡改"
        - "初始化工作区目录白名单，阻断跨目录危险逃逸"
    - num: "02"
      name: "CONTEXT ASSEMBLY"
      sub: "上下文预算与缓存装配"
      detail: "静态 System Prompt 置顶以命中 KV Cache 前缀；动态截取近期滑动历史，对超过阈值的长文本工具输出执行有损结构化裁剪。"
      expand_points:
        - "静态前缀保持字节级不可变，最大化云端/端侧 Prefix Cache 命中率"
        - "中间超长构建输出强制正则清洗，只保留 Exit Code 与核心报错堆栈"
    - num: "03"
      name: "INFERENCE & ROUTING"
      sub: "模型决策与工具调用意图"
      detail: "LLM 产出思考链 (Thought) 与工具调用意图 (Tool Call)。调用参数必须通过严格的强类型 JSON Schema / Pydantic 校验。"
      expand_points:
        - "参数拦截器在执行前校验必填字段，非法参数直接打回要求纠偏"
        - "支持单步工具调用与多工具并发计划，严格遵循依赖 DAG"
    - num: "04"
      name: "SANDBOX EXECUTION"
      sub: "受限沙箱隔离执行"
      detail: "在受控环境（PTY 伪终端 / Docker 隔离层）中运行工具。拦截破坏性命令，流式捕获输出，并设置心跳监控防止进程死锁挂死。"
      expand_points:
        - "高危命令正则匹配拦截（如 rm -rf /、mkfs、dd）"
        - "非阻塞流式输出捕获，超时自动级联下发 SIGKILL 杀孤儿进程"
    - num: "05"
      name: "OBSERVATION & EVAL"
      sub: "观察提取与自愈反思"
      detail: "清洗工具原始日志，提取关键错误行与退出码。运行单元测试与确定性断言 (Assertions)，评估当前状态是否朝向目标收敛。"
      expand_points:
        - "绝不轻信模型的自我声明，必须以客观 exit code 0 与测试断言为准"
        - "剥离终端无用进度条，提取确定性证据链塞回上下文"
    - num: "06"
      name: "STATE TRANSITION"
      sub: "工作记忆更新与终止判定"
      detail: "将观察注入工作记忆。若目标达成则生成产物并终结；若失败则记录 Reflexion 经验教训，自适应切换策略并进入下一轮循环。"
      expand_points:
        - "失败时强制要求模型在思考链中写明假设偏差与下一轮修正策略"
        - "生成原子 Git Commit 记录，确保整个演进过程可追溯可回退"

context_section:
  kicker: "02 / CONTEXT ENGINEERING"
  title: "提示词已死，上下文工程当立"
  lead: "单次对话依赖“神级提示词”，而复杂的多轮自主系统依赖的是严谨的“上下文工程学”。如何用最小的 Token 成本让模型在长周期执行中始终保持清醒，是区分玩具与工业级系统的生死线。点击展开各支柱查阅实操细节。"
  study_url: "/geek/context/"
  study_text: "进入《上下文工程 (Context Engineering) 完全指南》专篇深入学习 ↗"
  pillars:
    - title: "Attention Budget 与 KV Cache 优化"
      tag: "CACHE-AWARE ARCHITECTURE"
      badge: "LATENCY & COST"
      highlight: "前置字节级不可变 Prefix，有效利用 Prompt Caching 并大幅改善长提示首字延迟。"
      points:
        - "静态上下文严格置顶：System Prompt、工具元数据、代码规范必须维持字节级绝对不变，充分利用云端与本地的 Prefix Prompt Caching。"
        - "动态注意力预算衰减：自注意力权重并非无限廉价。多轮交互中，前序冗长输出会冲淡当前任务目标权重，引发“迷失在中间 (Lost-in-the-Middle)”。"
        - "尾部关键约束重强调：在每轮推理提示词的最后，强制回填当前目标与验收断言，把高注意力权重重新钉在核心指标上。"
      expand_points:
        - "成本与时延收益：前缀缓存命中时官方输入 Token 计费降低 75%~90%，且无需重复 Prefill 计算"
        - "反模式警示：切勿在前缀中动态拼接时间戳或无序字典，会导致缓存全量穿透"
    - title: "三层记忆体系分级解耦"
      tag: "LAYERED MEMORY HIERARCHY"
      badge: "WORKING / BUFFER / VECTOR"
      highlight: "借鉴计算机体系结构 L1/L2/DDR 层次，构建确定性记忆流转模型。"
      points:
        - "L1 Working Scratchpad（工作记忆）：存放当前步骤的状态机寄存器、待办步骤列表与局部环境变量，按步更新，保持极高纯度。"
        - "L2 Ephemeral Sliding Buffer（短期缓冲）：最近 3~5 轮交互历史。当超出阈值时执行有损压缩，剥离无用的重复构建日志，只保留退出码与关键报错行。"
        - "L3 Semantic & Episodic Memory（长期语义记忆）：基于向量嵌入与本地知识图谱。召回相似 Bug 的历史排查记录与代码规范，实现跨会话自我进化。"
      expand_points:
        - "L1 步步更新步步清空，确保工作态干净；L2 动态滑动，超出阈值折叠"
        - "L3 长期记忆通过 Embedding 动态检索注入，跨越单个会话的生命周期"
    - title: "工具契约与 Model Context Protocol (MCP)"
      tag: "TOOL PROTOCOL & CONTRACT"
      badge: "STANDARDIZED RPC"
      highlight: "告别散装脚本拼凑，以标准化开放协议构建解耦的工具生态。"
      points:
        - "强类型 JSON Schema 校验：杜绝模型猜测参数。在工具执行前拦截缺失参数与类型错误，将参数幻觉直接阻断在执行层之外。"
        - "落地 MCP 开放协议：将底层的 Git、GDB 调试器、文件系统检索、网络抓包工具解耦为独立的 MCP Server，跨 Agent 零摩擦复用。"
        - "幂等性与可逆事务：写文件前自动创建临时快照 (Shadow Copy)，执行崩溃时触发自动回滚，确保受检代码库始终处于干净可构建状态。"
      expand_points:
        - "标准 Client-Host-Server 架构，支持 stdio 与 SSE 通信"
        - "为团队沉淀可复用的底层基础设施，避免重复开发专用 Tool Wrapper"
    - title: "分层子代理 (Hierarchical Subagent)"
      tag: "SUBAGENT DAG ORCHESTRATION"
      badge: "COGNITIVE ISOLATION"
      highlight: "解决单 Agent 认知过载（Cognitive Overload）的终极系统解法。"
      points:
        - "认知过载断崖：当单上下文塞入超过 20 个复杂源文件与冗长测试日志时，模型的推理准确率与指令遵循能力呈现指数级劣化。"
        - "Parent-Child DAG 拓扑：主 Agent 仅掌握全局执行计划与验收标准，遇到搜索、静态检查或测试子任务时，派发独立的轻量 Child Subagent。"
        - "临时上下文瞬时销毁：Child Subagent 完成任务后，其消耗的上万 Token 搜索过程直接随子会话销毁，仅向主 Agent 回传精炼结构化结论。"
      expand_points:
        - "主从拓扑解耦：Parent 负责战略规划，Child 负责战术攻坚"
        - "临时子上下文瞬时销毁机制，将主上下文 Token 开销稳定压制在 10k 以内"

terminal_section:
  kicker: "03 / TERMINAL AGENTS"
  title: "终端自主 Coding Agent 架构解构"
  lead: "IDE 里的代码补全只是辅助，终端原生自主代理 (CLI Autonomous Harness) 正在重新定义工程师与软件系统的交互边界。点击各代理可展开查看架构对比与选型建议。"
  study_url: "/geek/terminal/"
  study_text: "进入《终端 Autonomous Coding Agent 深度解构》专篇深入学习 ↗"
  agents:
    - name: "Claude Code"
      tag: "OFFICIAL BENCHMARK"
      vendor: "Anthropic 官方"
      features:
        - "终端极简原生，极速冷启动与终端流式输出"
        - "独创 Compact 上下文收敛算法，长任务不发生记忆爆炸"
        - "原生支持 Subagent 派发，深层搜索不污染主上下文"
        - "克制严谨的工具集设计，单步改动极其审慎"
      verdict: "最符合资深工程师心智模型的 CLI Agent，代码污染率极低"
      expand_points:
        - "深度适配长上下文模型，优先使用带唯一上下文锚点的替换块"
        - "独创 compact 压缩机制，数十轮重构任务上下文仍保持清醒"
    - name: "Aider"
      tag: "GIT-NATIVE ARCHITECTURE"
      vendor: "Paul Gauthier / 开源标杆"
      features:
        - "基于 Tree-sitter 的代码库全景图 (Repo Map) 拓扑索引"
        - "与 Git 提交树深度绑定，每一步修改自动打原子 Commit"
        - "支持多种差异编辑模式（Search/Replace Block、Whole、Unified Diff）"
        - "代码符号引用与依赖解析极为扎实"
      verdict: "对中大型既有代码库的语法关系理解最深入，改动轨迹清晰透明"
      expand_points:
        - "Repo Map 使用 Tree-sitter 仅耗费 1k~2k Token 即可建立全库符号感知"
        - "支持 /undo 瞬间撤销修改，改动步步有 Git Commit 证据链"
    - name: "OpenCode / Roo Code / Cline"
      tag: "OPEN ECOSYSTEM"
      vendor: "开源社区主流"
      features:
        - "深度原生集成 MCP (Model Context Protocol) 插件体系"
        - "支持多后端推理切换（云端前沿大模型 / 本地 SLM 无缝切换）"
        - "完备的人机协同确认模式 (Human-in-the-loop Approval Mode)"
        - "高度可定制的系统提示词与工程规则配置系统"
      verdict: "生态扩展性最强，适合定制专属硬件/底层工具链工作流"
      expand_points:
        - "全量支持第三方自定义 MCP Server 挂载"
        - "支持本地 Ollama / vLLM 离线部署模型，满足企业内网强合规需求"
  challenges:
    - title: "代码修改策略的三大流派与权衡"
      tag: "DIFF STRATEGY"
      desc: "全文件重写 (Whole File) 极耗 Token 且容易漏写函数；Unified Diff 在大模型生成中极易错位行号导致 patch 失败；基于前后上下文锚点的定位块替换 (Search/Replace Block) 是当前工业界平衡 Token 成本与准确率的最优解。"
    - title: "PTY 伪终端长任务管理与防挂死"
      tag: "PTY INTERACTION"
      desc: "内核构建与复杂测试动辄数分钟，且可能抛出交互式 prompt（如确认按键、密码输入）。必须依托非阻塞 PTY 流式捕获、心跳检测与超时熔断，杜绝 Agent 陷入无限阻塞死锁。"
    - title: "沙箱隔离与高危命令防御"
      tag: "SECURITY PERIMETER"
      desc: "将无约束的 Shell 权限交给大模型等同于让 root 裸奔。工业级终端 Agent 必须建立高危命令模式拦截、工作区目录白名单限制，并在可能的情况下运行于 Docker 或轻量 MicroVM 隔离沙箱内。"

embodied_section:
  kicker: "04 / EMBODIED INTELLIGENCE"
  title: "物理世界的端到端闭环：双速率控制架构"
  lead: "纯软件 Agent 报错最多抛出一个 Exception，具身智能系统一旦失控就会发生电机烧毁、机械臂过冲甚至物理伤害。从芯片与操作系统的底层视角看，具身智能的核心在于“双速率软硬件协同”。点击可展开技术实现。"
  study_url: "/geek/embodied/"
  study_text: "进入《具身智能双速率控制架构》专篇深入学习 ↗"
  loops:
    - name: "快环 · 实时反射控制 (High-Frequency Reflex Loop)"
      rate: "100Hz ~ 1kHz"
      hardware: "裸机固件 / RTOS (FreeRTOS / Zephyr) / 专用 DSP & FPGA"
      tag: "DETERMINISTIC REFLEX"
      duties:
        - "电机 FOC 矢量力矩控制与编码器角度闭环反馈"
        - "微秒级末端笛卡尔阻抗控制与逆运动学 (IK) 解算"
        - "机械碰撞毫秒级检测、电流过载保护与硬件急停 (E-Stop)"
      constraint: "确定性时钟抖动 < 10μs，绝对不可被大模型慢推理阻塞，零外部网络依赖"
      expand_points:
        - "基于笛卡尔阻抗模型 F = Kp(xd - x) + Kd(vd - v)，接触外界瞬间柔顺顺应"
        - "硬件看门狗在连续 300ms 未收慢环更新时，自主触发制动锁轴保护"
    - name: "慢环 · 语义认知规划 (Low-Frequency Cognitive Loop)"
      rate: "5Hz ~ 20Hz"
      hardware: "端侧高算力 Linux SoC / NPU / Jetson / 本地边缘 GPU"
      tag: "SEMANTIC COGNITION"
      duties:
        - "多模态 VLA (Vision-Language-Action) 端到端模型推理"
        - "RGB-D 多视角点云语义分割、目标识别与 6D 位姿估计"
        - "环境 Affordance 拓扑理解与长程任务动作轨迹生成"
      constraint: "计算密集型，依赖 INT8/FP8 稀疏量化、PagedAttention 与常驻 NPU 加速"
      expand_points:
        - "输出空间三维路标点（Waypoints）与抓取姿态，而非不可控的底层 PWM"
        - "基于 INT8 量化与 FlashAttention，将多模态大模型端侧单帧延迟压至 60ms"
  infra:
    - title: "跨域零拷贝共享内存 (Zero-copy IPC)"
      tag: "DMA-BUF / UIO"
      desc: "通过 dma-buf / UIO 建立 NPU 推理域与 RTOS 控制核之间的共享内存环形队列，消除百万级点云与张量的内存拷贝开销，端到端延迟压缩至亚毫秒级。"
    - title: "微内核通信拓扑 (Zenoh & ROS 2)"
      tag: "MICRO-DDS"
      desc: "替代传统臃肿的重量级中间件，使用 Zenoh 或精简版 Cyclone DDS 实现跨节点纳秒级低时延 Pub/Sub，满足嵌入式微控制器的资源受限要求。"
    - title: "传感器硬件微秒级硬同步"
      tag: "PTP / IEEE 1588"
      desc: "基于 PTP (IEEE 1588) 或专用硬件 GPIO 触发引脚，实现多路相机全局快门曝光、IMU 惯导采样与电机编码器的高精度纳秒级时钟对齐。"

