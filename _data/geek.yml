radar_section:
  kicker: "06 / TECHNOLOGY NOTES"
  title: "技术观察：先用、试验、跟进与慎用"
  lead: "按验证难度和应用条件整理一份学习与试验清单。分类只是讨论起点，没有统一的实测排名；采用前应在具体任务上检查成本、质量与风险。"
  categories:
    - name: "ADOPT"
      badge: "优先考虑"
      color: "adopt"
      desc: "优先检查输入组织、修改校验与任务验收等基础问题，再按复用需求决定是否引入协议。"
      expand_title: "展开查看落地依据"
      expand_points:
        - "Context Engineering: 检查当前状态与必要证据是否进入上下文，并测量缓存收益"
        - "MCP: 多个客户端需要复用工具时，核对协议能力、传输方式和权限"
        - "Search & Replace: 适用于按原文定位的局部修改，仍需检查唯一匹配和实际 Diff"
        - "Assertions: 通过外部检查确认任务要求，注意验收覆盖范围"
      items:
        - name: "Context Engineering (KV-Cache Optimization)"
          desc: "组织相关输入与稳定前缀，测量缓存命中、时延和任务完成情况。"
        - name: "Model Context Protocol (MCP)"
          desc: "需要跨客户端复用工具时可考虑，仍要处理认证与权限配置。"
        - name: "Search & Replace Block Diff"
          desc: "局部修改时可减少输出，原文重复或已变化时需要重新定位。"
        - name: "Deterministic Assertions in ReAct"
          desc: "将任务验收放在模型之外；测试通过仍需核对检查覆盖了什么。"
    - name: "TRIAL"
      badge: "小范围试验"
      color: "trial"
      desc: "先用有明确验收标准的任务测量收益，再判断复杂度和运行成本是否值得。"
      expand_title: "展开查看落地依据"
      expand_points:
        - "Subagent: 检查摘要质量、来源和额外调用成本，共享编辑需协调"
        - "Fast-Slow Loop: 分别测量推理时延与控制周期，验证失联处理"
        - "Speculative Decoding: 收益受草稿接受率、模型组合与负载影响，应与原部署比较"
        - "PagedAttention / Chunked Prefill: 分别关注 KV Cache 管理与调度，测量并发负载下的时延和吞吐"
      items:
        - name: "Hierarchical Subagent DAG"
          desc: "独立搜索可以分工，需核对摘要准确性和新增调用成本。"
        - name: "Fast-Slow Dual Loop for Embodied AI"
          desc: "分离上层动作生成与本地反馈控制，周期按机构和硬件确定。"
        - name: "Speculative Decoding (投机解码)"
          desc: "通过草稿生成与目标模型验证减少解码开销，实际加速需要测量。"
        - name: "PagedAttention & Chunked Prefill"
          desc: "分别优化 KV Cache 分配与预填充调度，收益取决于模型和请求负载。"
    - name: "ASSESS"
      badge: "重点跟进"
      color: "assess"
      desc: "继续阅读论文和实现，先明确评价方法，再判断是否适合自己的任务。"
      expand_title: "展开查看落地依据"
      expand_points:
        - "Test-Time Compute: 比较额外推理预算带来的准确率收益与时延成本"
        - "Chip-Domain SLM: 检查领域数据质量、模型容量与目标板卡资源"
        - "World Models: 检查生成环境与真实物理差异，关注迁移验证方法"
        - "Agentic Eval: 检查任务定义、工具权限、数据污染与结果可复现性"
      items:
        - name: "Test-Time Compute Scaling"
          desc: "增加推理预算可能改善部分任务表现，同时增加成本和时延。"
        - name: "Chip-Domain Local SLM Fine-tuning"
          desc: "探索手册、勘误和驱动代码的领域适配，需要独立的事实与任务评测。"
        - name: "World Models for Robotics Simulation"
          desc: "关注环境预测与仿真用途，生成结果仍需与真实系统比较。"
        - name: "Agentic Eval Harness (SWE-bench / GAIA)"
          desc: "SWE-bench 与 GAIA 面向不同任务，应分别核对数据集和评分条件。"
    - name: "HOLD"
      badge: "审慎观望"
      color: "hold"
      desc: "在缺少权限边界、预算或验证反馈时，先补足这些条件，再扩大执行范围。"
      expand_title: "展开查看避坑建议"
      expand_points:
        - "Shell Execution: 无明确权限范围时，错误命令可能影响任务目录之外的资源"
        - "Agent Swarms: 缺少分工、依赖管理和预算时，协作可能增加重复调用与等待"
        - "Chat-only Workflow: 只有文本输出时，不能直接确认代码已修改或环境状态已改变"
      items:
        - name: "Unsandboxed Shell Execution"
          desc: "先定义文件、网络和命令权限，再启用自动执行。"
        - name: "Unconstrained Agent Swarms"
          desc: "代理数量增加前，先明确任务边界、依赖与总预算。"
        - name: "Chat-only Execution Claims"
          desc: "文本建议可以辅助排查，环境变更仍需工具执行和外部验证。"

