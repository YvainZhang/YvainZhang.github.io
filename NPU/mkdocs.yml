site_name: NPU / AI 芯片全栈知识体系（原厂视角）
site_description: 从脉动阵列微架构、片上 SRAM 到 AI 编译器、驱动与集群互联的 NPU 全栈知识库
site_url: https://xidianedu.cc/tech/npu/
docs_dir: .
site_dir: ../NPU-site
exclude_docs: |
  mkdocs.yml
  requirements-docs.txt
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: zh
  - mermaid2
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
